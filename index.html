<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dota Search</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/js-circle-progress@1.0.0/+esm"></script>
</head>
<body>

    <h1>Dota Search</h1>
    <p>Поиск игроков по нику</p>

    <input type="text" id="playerNameInput" placeholder="Введите ник">
    <button id="searchButton">Найти</button>

    <p id="loading" style="display:none;">Поиск...</p>
    <p id="error" style="color:red;"></p>

    <div id="results"></div>

    <div id="modal" class="modal-overlay" style="display: none;">
        <div class="modal-window">
            <span class="modal-close" id="modalClose">&times;</span>
            <div id="modalContent">
               
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
